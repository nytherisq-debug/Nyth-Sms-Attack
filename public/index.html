<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03050a">
<title>Nyth Quantum Core</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;800&display=swap');

:root{
  --bg-dark:#03050a;
  --bg-panel:rgba(8, 12, 22, 0.35);
  --bg-input:rgba(0, 0, 0, 0.5);
  --border-subtle:rgba(255, 255, 255, 0.1);
  --border-glow:rgba(56, 189, 248, 0.4);
  
  --text-main:#f8fafc;
  --text-muted:#94a3b8;
  --text-dark:#334155;
  --accent-cyan:#38bdf8;
  --accent-purple:#a855f7;
  --accent-rose:#f43f5e;
  --accent-green:#34d399;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100vh;height:100dvh;width:100vw;margin:0;padding:0;
  font-family:'Space Grotesk',system-ui,sans-serif;
  background:var(--bg-dark);color:var(--text-main);overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
body{display:flex;align-items:center;justify-content:center;padding:12px}

/* ============================================================
   PREMIUM BACKGROUND
   ============================================================ */
#net{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}
.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(56,189,248,.1) 1px,transparent 1px),
    linear-gradient(90deg,rgba(56,189,248,.1) 1px,transparent 1px);
  background-size: 60px 60px;
  perspective: 500px;
  transform: rotateX(60deg) translateY(-100px) translateZ(-100px);
  transform-origin: bottom center;
  animation: gridMove 10s linear infinite;
  opacity: 0.3;
}
@keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 0 60px; } }

.aurora {
  position: fixed; border-radius: 50%; filter: blur(120px); z-index: 0; pointer-events: none;
  opacity: 0.5; will-change: transform;
  mix-blend-mode: screen;
}
.aurora-1 {
  width: 60vw; height: 60vw; top: -10%; left: -10%;
  background: radial-gradient(circle, #0ea5e9 0%, transparent 60%);
  animation: float1 18s ease-in-out infinite alternate;
}
.aurora-2 {
  width: 60vw; height: 60vw; bottom: -20%; right: -10%;
  background: radial-gradient(circle, #a855f7 0%, transparent 60%);
  animation: float2 22s ease-in-out infinite alternate;
}
.aurora-3 {
  width: 50vw; height: 50vw; top: 30%; left: 30%;
  background: radial-gradient(circle, #f43f5e 0%, transparent 60%);
  opacity: 0.3;
  animation: float3 25s ease-in-out infinite alternate;
}
@keyframes float1 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(80px, 50px) scale(1.2); } }
@keyframes float2 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-80px, -50px) scale(1.1); } }
@keyframes float3 { 0% { transform: translate(0,0) scale(0.9); } 100% { transform: translate(50px, -30px) scale(1.3); } }

.light-beam {
  position: fixed; top: -20%; bottom: -20%; width: 2px;
  background: linear-gradient(180deg, transparent, rgba(56,189,248,.6), transparent);
  animation: beamMove 6s ease-in-out infinite; pointer-events: none; z-index: 0;
  box-shadow: 0 0 20px 2px rgba(56,189,248,.4);
}
.light-beam.b1 { left: 15%; animation-delay: 0s; }
.light-beam.b2 { left: 50%; animation-delay: 2s; background: linear-gradient(180deg, transparent, rgba(168,85,247,.5), transparent); }
.light-beam.b3 { left: 85%; animation-delay: 4s; }
@keyframes beamMove { 0%,100% { transform: translateY(-100%); opacity: 0; } 50% { transform: translateY(100%); opacity: 1; } }

.scanlines {
  position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.15;
  background: repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(255,255,255,.03) 2px,rgba(255,255,255,.03) 3px);
  mix-blend-mode: overlay;
}

/* ============================================================
   BOOT
   ============================================================ */
#boot{position:fixed;inset:0;z-index:99;background:var(--bg-dark);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .6s ease,visibility .6s ease}
#boot.gone{opacity:0;visibility:hidden;pointer-events:none}
.boot-logo{font-family:'Orbitron',sans-serif;font-weight:800;font-size:18px;
  letter-spacing:.5em;color:var(--accent-cyan);text-shadow:0 0 20px var(--accent-cyan)}
.boot-bar{width:170px;height:2px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.boot-fill{width:40%;height:100%;
  background:linear-gradient(90deg,transparent,var(--accent-cyan),transparent);
  animation:bootLoad 1.2s ease-in-out infinite}
@keyframes bootLoad{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}

/* ============================================================
   SHELL (Glassmorphism)
   ============================================================ */
.shell{position:relative;z-index:2;display:flex;flex-direction:column;
  width:100%;max-width:400px;
  height:auto;
  max-height:calc(100dvh - 24px);
  padding:18px;gap:12px;border-radius:24px;
  background:var(--bg-panel);
  backdrop-filter:blur(20px) saturate(200%);-webkit-backdrop-filter:blur(20px) saturate(200%);
  border:1px solid var(--border-glow);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.08) inset,
    0 30px 60px -20px rgba(0,0,0,.9),
    0 0 80px -20px rgba(56,189,248,.4);
  transform:translateZ(0);
  transition:box-shadow .4s ease,border-color .4s ease;
  overflow:hidden;
}
.shell::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.1) 0,transparent 20%,transparent 80%,rgba(255,255,255,.02) 100%)}
.shell::after {
  content: ''; position:absolute; top: -100%; left: 0; right: 0; height: 50%;
  background: linear-gradient(180deg, transparent, rgba(56, 189, 248, 0.2), transparent);
  pointer-events: none; z-index: 10;
  animation: shellScan 6s linear infinite;
}
@keyframes shellScan { 0% { top: -100%; } 100% { top: 200%; } }

body.running .shell{
  border-color:rgba(56,189,248,.9);
  box-shadow:
    0 0 0 1px rgba(56,189,248,.5) inset,
    0 30px 60px -20px rgba(0,0,0,.9),
    0 0 120px -10px rgba(56,189,248,.7);
  animation: shellPulse 2s infinite alternate;
}
@keyframes shellPulse {
  0% { box-shadow: 0 0 100px -20px rgba(56,189,248,.5); }
  100% { box-shadow: 0 0 120px -10px rgba(56,189,248,.9); }
}

/* TAPPED ANIMATION */
.shell.tapped { animation: shellTap 0.3s ease-out; }
@keyframes shellTap { 0% { transform: scale(1); } 50% { transform: scale(0.98); } 100% { transform: scale(1); } }

.corner{position:absolute;width:18px;height:18px;border-color:var(--accent-cyan);
  opacity:.8;pointer-events:none;transition:all .4s cubic-bezier(.2,.8,.2,1);z-index:3}
.corner.tl{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid;border-top-left-radius:16px}
.corner.tr{top:-1px;right:-1px;border-top:2px solid;border-right:2px solid;border-top-right-radius:16px}
.corner.bl{bottom:-1px;left:-1px;border-bottom:2px solid;border-left:2px solid;border-bottom-left-radius:16px}
.corner.br{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid;border-bottom-right-radius:16px}
body.running .corner{opacity:1;width:22px;height:22px;filter:drop-shadow(0 0 10px var(--accent-cyan))}

.flex-shrink-0{flex-shrink:0}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding-bottom:2px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}

/* ============================================================
   LOGO ANIMATIONS (N is moving!)
   ============================================================ */
.logo-box{position:relative;width:40px;height:40px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.7);border:1px solid rgba(56,189,248,.5);
  box-shadow:0 0 20px -5px rgba(56,189,248,.5),inset 0 0 15px rgba(56,189,248,.2);
  overflow:hidden;transition:all .3s}
body.running .logo-box{border-color:var(--accent-cyan);box-shadow:0 0 30px 0 rgba(56,189,248,.8)}

.logo-ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 4s linear infinite}
.logo-ring circle{fill:none;stroke-width:1.5;stroke-linecap:round}
.logo-ring .r1{stroke:var(--accent-cyan);opacity:.85;stroke-dasharray:40 60}
.logo-ring .r2{stroke:var(--accent-purple);opacity:.65;stroke-dasharray:20 80;animation:spin 2.5s linear infinite reverse}

.logo-ring-outer{position:absolute;inset:0;width:100%;height:100%;animation:spin 15s linear infinite reverse}
.logo-ring-outer circle{fill:none;stroke:rgba(56,189,248,.4);stroke-width:1;stroke-dasharray:2 4}

@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.logo-n{
  position:relative;z-index:2;width:20px;height:20px;
  animation: floatN 3s ease-in-out infinite, glowN 2s infinite alternate;
}
@keyframes floatN {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-3px) scale(1.05); }
}
@keyframes glowN {
  0% { filter: drop-shadow(0 0 3px rgba(56,189,248,.8)); }
  100% { filter: drop-shadow(0 0 10px rgba(56,189,248,1)) drop-shadow(0 0 15px rgba(168,85,247,.8)); }
}

.n-main,.n-red,.n-blue{fill:none;stroke-width:3.5;stroke-linecap:square;stroke-linejoin:miter}
.n-main{stroke:url(#nGrad)}
.n-red{stroke:var(--accent-rose);animation:glitchRed 1.5s infinite steps(1);opacity:0}
.n-blue{stroke:var(--accent-cyan);animation:glitchBlue 1.5s infinite steps(1);opacity:0}

@keyframes glitchRed{
  0%,85%,100%{transform:translate(0);opacity:0}
  86%{transform:translate(-3px,-1px);opacity:.9}
  88%{transform:translate(2px,1px);opacity:0}
  90%{transform:translate(-2px,0);opacity:.9}
  92%{transform:translate(0);opacity:0}}
@keyframes glitchBlue{
  0%,85%,100%{transform:translate(0);opacity:0}
  86%{transform:translate(3px,1px);opacity:.9}
  88%{transform:translate(-2px,-1px);opacity:0}
  90%{transform:translate(2px,0);opacity:.9}
  92%{transform:translate(0);opacity:0}}

.logo-scan{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(125,211,252,1),transparent);
  height:2px;width:100%;top:-10%;animation:scanLine 2.5s cubic-bezier(.4,0,.2,1) infinite}
@keyframes scanLine{0%{top:-10%;opacity:0}10%{opacity:1}90%{top:110%;opacity:1}100%{top:110%;opacity:0}}

.brand-text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.title{position:relative;display:block;font-family:'Orbitron',sans-serif;
  font-weight:800;font-size:12px;letter-spacing:.03em;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .t-base{position:relative;background:linear-gradient(90deg,#7dd3fc,#c084fc,#f0abfc);
  -webkit-background-clip:text;background-clip:text;color:transparent;z-index:2}
.title .t-red,.title .t-blue{position:absolute;top:0;left:0;opacity:0;mix-blend-mode:screen;z-index:1}
.title .t-red{color:var(--accent-rose);animation:tGlitchRed 3s infinite steps(1)}
.title .t-blue{color:var(--accent-cyan);animation:tGlitchBlue 3s infinite steps(1)}

.subtitle{font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;
  color:#cbd5e1;letter-spacing:.05em;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Utilities Group (Music + Status) */
.utilities{display:flex;align-items:center;gap:6px;flex-shrink:0}

/* Music Widget */
.music-widget{
  position:relative;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:rgba(0,0,0,0.5);
  cursor:pointer;transition:all .3s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
}
.music-widget:active{transform:scale(0.9)}
.music-widget.playing{background:rgba(56,189,248,0.2);box-shadow:0 0 15px rgba(56,189,248,0.5)}

.music-bars{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:14px;position:relative;z-index:2}
.music-bars span{
  width:2.5px;border-radius:1.5px;background:var(--text-muted);
  transition:background .3s,box-shadow .3s,height .3s;
}
.music-bars span:nth-child(1){height:4px}.music-bars span:nth-child(2){height:8px}
.music-bars span:nth-child(3){height:12px}.music-bars span:nth-child(4){height:8px}
.music-bars span:nth-child(5){height:4px}

.music-widget.playing .music-bars span{
  background:linear-gradient(180deg,#fff,var(--accent-cyan));
  box-shadow:0 0 6px var(--accent-cyan);
  animation:equalize 0.7s infinite alternate cubic-bezier(0.2, 0.8, 0.2, 1);
}
.music-widget.playing .music-bars span:nth-child(1){animation-delay:0s}
.music-widget.playing .music-bars span:nth-child(2){animation-delay:.2s}
.music-widget.playing .music-bars span:nth-child(3){animation-delay:.4s}
.music-widget.playing .music-bars span:nth-child(4){animation-delay:.1s}
.music-widget.playing .music-bars span:nth-child(5){animation-delay:.3s}

@keyframes equalize{0%{height:3px;opacity:0.6}100%{height:14px;opacity:1}}

/* Status Badge */
.status-badge{
  display:flex;align-items:center;gap:5px;
  padding:5px 8px;border-radius:6px;
  background:rgba(0,0,0,0.6);border:1px solid var(--border-subtle);
  transition:all .3s;white-space:nowrap;
}
body.running .status-badge{border-color:rgba(56,189,248,.6);background:rgba(56,189,248,.15)}
.status-dot{width:5px;height:5px;border-radius:50%;
  background:var(--accent-green);box-shadow:0 0 6px var(--accent-green);flex-shrink:0}
body.running .status-dot{background:var(--accent-cyan);box-shadow:0 0 10px var(--accent-cyan);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.status-text{font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.08em;color:#cbd5e1}
body.running .status-text{color:var(--accent-cyan)}

/* PROGRESS */
.arc-wrap{position:relative}
.arc-ticks{display:flex;gap:2px;margin-bottom:4px;height:4px}
.arc-ticks .tick{flex:1;background:rgba(255,255,255,.1);border-radius:1px;transition:all .3s}
.arc-ticks .tick.on{background:var(--accent-cyan);box-shadow:0 0 6px var(--accent-cyan);animation:tickPulse .4s ease forwards}
@keyframes tickPulse{0%{transform:scaleY(1)}50%{transform:scaleY(1.5)}100%{transform:scaleY(1)}}

.arc-track{height:4px;border-radius:4px;background:rgba(0,0,0,.6);position:relative;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
#arcFill{height:100%;width:0%;border-radius:4px;position:relative;
  background:linear-gradient(90deg,var(--accent-cyan),var(--accent-purple),var(--accent-rose));
  background-size:200% 100%;animation:flow 3s linear infinite;
  transition:width .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px var(--accent-cyan)}
#arcFill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:20px;background:linear-gradient(90deg,transparent,#fff);opacity:.8;filter:blur(2px)}
@keyframes flow{0%{background-position:0% 50%}100%{background-position:200% 50%}}

.arc-meta{display:flex;justify-content:space-between;margin-top:4px;
  font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;
  color:#cbd5e1;letter-spacing:.08em}
.arc-meta strong{color:var(--text-main);font-weight:700}

/* FORM */
.form-group{display:flex;flex-direction:column;gap:10px}
.input-group{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.label-row{display:flex;justify-content:space-between;align-items:center;gap:4px}
label{font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:700;
  color:#cbd5e1;letter-spacing:.05em;transition:color .3s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.input-group.focused label{color:var(--accent-cyan)}
.meta-label{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--text-muted);white-space:nowrap}

.input-field{width:100%;padding:10px 12px;border-radius:8px;
  background:var(--bg-input);border:1px solid var(--border-subtle);
  color:var(--text-main);font-family:'JetBrains Mono',monospace;font-size:13px;
  transition:all .3s;box-shadow:inset 0 2px 10px rgba(0,0,0,0.6)}
.input-field::placeholder{color:var(--text-dark)}
.input-field:hover{border-color:rgba(255,255,255,.3)}
.input-field:focus{outline:none;border-color:var(--accent-cyan);
  background:rgba(56,189,248,.1);
  box-shadow:0 0 0 3px rgba(56,189,248,.2),inset 0 0 15px rgba(56,189,248,.15);
  animation: inputGlow 2s infinite alternate;}
@keyframes inputGlow {
  0% { box-shadow: 0 0 0 3px rgba(56,189,248,.1), inset 0 0 10px rgba(56,189,248,.1); }
  100% { box-shadow: 0 0 0 4px rgba(56,189,248,.3), inset 0 0 20px rgba(56,189,248,.2); }
}
.input-field.invalid{border-color:var(--accent-rose);box-shadow:0 0 0 3px rgba(244,63,94,.2); animation:none;}

.op-pills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pill-btn{position:relative;padding:8px 2px;border-radius:8px;
  background:var(--bg-input);border:1px solid var(--border-subtle);
  color:#cbd5e1;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;transition:all .2s;white-space:nowrap;box-shadow:inset 0 2px 5px rgba(0,0,0,0.4);
  overflow:hidden;}
.pill-btn::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,0.1);opacity:0;transition:opacity 0.2s;}
.pill-btn:hover::before{opacity:1;}
.pill-btn:active{transform:scale(.95)}
.pill-btn.active{color:var(--text-main);border-color:rgba(56,189,248,.7);
  background:rgba(56,189,248,.2);box-shadow:inset 0 0 15px rgba(56,189,248,.3)}
.pill-btn.active[data-op="mytel"]{border-color:rgba(244,63,94,.7);background:rgba(244,63,94,.2);box-shadow:inset 0 0 15px rgba(244,63,94,.3)}
.pill-btn.active[data-op="u9"]{border-color:rgba(168,85,247,.7);background:rgba(168,85,247,.2);box-shadow:inset 0 0 15px rgba(168,85,247,.3)}
.pill-btn.active[data-op="wave"]{border-color:rgba(52,211,153,.7);background:rgba(52,211,153,.2);box-shadow:inset 0 0 15px rgba(52,211,153,.3)}

.pill-dot{width:5px;height:5px;border-radius:50%;transition:box-shadow .3s;flex-shrink:0}
.pill-btn.active .pill-dot{box-shadow:0 0 8px currentColor}
.dot-sky{background:var(--accent-cyan);color:var(--accent-cyan)}
.dot-rose{background:var(--accent-rose);color:var(--accent-rose)}
.dot-purple{background:var(--accent-purple);color:var(--accent-purple)}
.dot-green{background:var(--accent-green);color:var(--accent-green)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* BUTTONS */
.actions{display:flex;gap:8px;margin-top:4px}
.btn-primary{flex:1;padding:12px 8px;border-radius:10px;border:1px solid rgba(56,189,248,.6);
  background:linear-gradient(180deg,rgba(11,18,32,0.9),rgba(8,12,21,0.9));
  color:#f0f9ff;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:800;
  letter-spacing:.1em;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:0 10px 30px -12px rgba(59,130,246,.8),0 0 40px -20px rgba(56,189,248,1);
  transition:all .2s;white-space:nowrap}
.btn-primary:hover:not(:disabled){filter:brightness(1.3);transform:translateY(-1px);border-color:var(--accent-cyan)}
.btn-primary:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn-primary:disabled{filter:grayscale(1) brightness(.4);cursor:not-allowed;border-color:transparent;box-shadow:none;transform:none}
.btn-primary::after{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-20deg)}
.btn-primary.engine-active::after{animation:shine 1.5s infinite}
@keyframes shine{100%{left:200%}}

/* Ripple Effect */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(56, 189, 248, 0.5);
  transform: scale(0);
  animation: ripple-anim 0.6s linear;
  pointer-events: none;
}
@keyframes ripple-anim {
  to { transform: scale(4); opacity: 0; }
}

.btn-danger{padding:12px 14px;border-radius:10px;border:1px solid rgba(244,63,94,.5);
  background:rgba(244,63,94,.15);color:var(--accent-rose);
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800;letter-spacing:.05em;
  cursor:pointer;transition:all .2s;white-space:nowrap;position:relative;overflow:hidden;}
.btn-danger:hover:not(:disabled){background:rgba(244,63,94,.3);border-color:var(--accent-rose)}
.btn-danger:active:not(:disabled){transform:scale(.98)}
.btn-danger:disabled{opacity:.2;cursor:not-allowed;transform:none}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-box{position:relative;padding:10px 12px;border-radius:10px;
  background:linear-gradient(180deg,rgba(5,8,16,.7),rgba(3,6,12,.5));
  border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 2px 10px rgba(0,0,0,.5);
  overflow:hidden;transition:all .3s}
body.running .stat-box{border-color:rgba(56,189,248,.4)}
.stat-box::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.stat-ok::before{background:var(--accent-green);box-shadow:0 0 10px var(--accent-green)}
.stat-err::before{background:var(--accent-rose);box-shadow:0 0 10px var(--accent-rose)}

.stat-title{font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:800;
  color:#cbd5e1;letter-spacing:.1em;margin-bottom:4px;text-transform:uppercase}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums}
.stat-ok .stat-val{color:var(--accent-green);text-shadow:0 0 15px rgba(52,211,153,.8)}
.stat-err .stat-val{color:var(--accent-rose);text-shadow:0 0 15px rgba(244,63,94,.8)}
.stat-val.bump{animation:bumpAnim .4s cubic-bezier(.2,.8,.2,1)}
@keyframes bumpAnim{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}

.stat-underline{position:absolute;left:12px;right:12px;bottom:6px;height:2px;
  background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.stat-underline::after{content:'';position:absolute;inset:0;opacity:.8;animation:pulseBar 2.4s infinite ease-in-out;transform-origin:left}
.stat-ok .stat-underline::after{background:linear-gradient(90deg,var(--accent-green),transparent)}
.stat-err .stat-underline::after{background:linear-gradient(90deg,var(--accent-rose),transparent)}
@keyframes pulseBar{0%,100%{transform:scaleX(.3)}50%{transform:scaleX(1)}}

/* LOG (Compact, Fixed Height) */
.log-section{
  display:flex;flex-direction:column;
  margin-top:2px;
}
.log-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.log-title{font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:800;
  color:#cbd5e1;letter-spacing:.1em;text-transform:uppercase}

.log-tabs{display:flex;gap:2px;background:rgba(0,0,0,.6);padding:2px;border-radius:6px;border:1px solid var(--border-subtle)}
.log-tab{padding:2px 6px;border-radius:4px;border:none;background:transparent;
  color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:800;
  cursor:pointer;transition:all .2s}
.log-tab.active{background:rgba(56,189,248,.2);color:var(--accent-cyan)}
.btn-clear{background:none;border:none;color:var(--text-muted);
  font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:800;
  cursor:pointer;padding:2px 4px;transition:color .2s}
.btn-clear:hover{color:var(--accent-cyan)}

.log-console{
  height: 130px;
  overflow-y:auto;border-radius:10px;
  background:rgba(0,0,0,.8);border:1px solid rgba(56,189,248,.2);
  padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.5;
  box-shadow:inset 0 0 30px rgba(0,0,0,.9);
  overscroll-behavior:contain;user-select:text;-webkit-user-select:text;
  position:relative}
.log-console::-webkit-scrollbar{width:4px}
.log-console::-webkit-scrollbar-thumb{background:rgba(56,189,248,.5);border-radius:4px}

.log-line{display:flex;align-items:baseline;gap:6px;padding:2px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
  animation:slideIn .2s ease-out;text-shadow:0 1px 2px rgba(0,0,0,.8)}
@keyframes slideIn{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:translateX(0)}}

.log-idx{color:var(--accent-cyan);font-weight:700;font-size:8.5px;flex-shrink:0;min-width:24px;opacity:.9}
.log-line.sys .log-idx{color:var(--text-muted)}
.log-time{color:var(--text-dark);font-size:8.5px;flex-shrink:0}
.log-msg{flex:1;word-break:break-word;white-space:pre-wrap}

.log-success{color:var(--accent-green)}
.log-error{color:var(--accent-rose)}
.log-sys{color:var(--accent-cyan)}
.log-warn{color:#fbbf24}
.log-info{color:#cbd5e1}

.log-line:last-child .log-msg::after{content:'';display:inline-block;width:5px;height:9px;
  background:currentColor;margin-left:4px;animation:blinkCursor 1s step-end infinite;vertical-align:middle}
@keyframes blinkCursor{50%{opacity:0}}

/* MOBILE TWEAKS */
@media (max-height:720px){
  .shell{padding:14px;gap:10px}
  .input-field{padding:8px 10px}
  .arc-ticks{display:none}
}

<body>

<script>
'use strict';

const BACKEND_URL = "https://nyth-sms-attack-production.up.railway.app";

const mainShell = document.getElementById('mainShell');
const buttons = document.querySelectorAll('.btn-primary, .btn-danger, .pill-btn');

buttons.forEach(btn => {
  btn.addEventListener('click', function(e) {
    const rect = this.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    this.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
    
    mainShell.classList.remove('tapped');
    void mainShell.offsetWidth;
    mainShell.classList.add('tapped');
  });
});

/* AUDIO LOGIC */
const audio = document.getElementById('bgAudio');
const musicWidget = document.getElementById('musicWidget');
let isPlaying = false;
let audioUnlocked = false;

function playAudio() {
  if (!audio.paused) return;
  audio.play().then(() => {
    isPlaying = true;
    audioUnlocked = true;
    musicWidget.classList.add('playing');
    
    window.removeEventListener('pointerdown', unlockAudio, true);
    window.removeEventListener('touchstart', unlockAudio, true);
    window.removeEventListener('touchend', unlockAudio, true);
    window.removeEventListener('click', unlockAudio, true);
  }).catch(e => console.log('Audio block prevented, will retry.', e));
}

const unlockAudio = () => {
  if (audioUnlocked) return;
  playAudio();
};

window.addEventListener('pointerdown', unlockAudio, { capture: true, passive: true });
window.addEventListener('touchstart', unlockAudio, { capture: true, passive: true });
window.addEventListener('touchend', unlockAudio, { capture: true, passive: true });
window.addEventListener('click', unlockAudio, { capture: true, passive: true });

audio.addEventListener('play', () => { isPlaying = true; musicWidget.classList.add('playing'); });
audio.addEventListener('pause', () => { isPlaying = false; musicWidget.classList.remove('playing'); });

function toggleMusic(event) {
  if (event) { event.stopPropagation(); event.preventDefault(); }
  if (isPlaying) {
    audio.pause();
  } else {
    playAudio();
  }
}

setTimeout(() => document.getElementById('boot').classList.add('gone'), 1400);

(() => {
  const wrap = document.getElementById('arcTicks');
  for (let i = 0; i < 20; i++) {
    const t = document.createElement('div');
    t.className = 'tick';
    wrap.appendChild(t);
  }
})();

/* Particle Canvas */
(() => {
  const c = document.getElementById('net');
  const ctx = c.getContext('2d');
  let w = 0, h = 0, dpr = 1;
  const pts = [];
  let touchX = null, touchY = null;
  
  const resize = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = c.width = Math.floor(innerWidth * dpr);
    h = c.height = Math.floor(innerHeight * dpr);
    c.style.width = innerWidth + 'px';
    c.style.height = innerHeight + 'px';
  };
  resize();
  addEventListener('resize', resize);
  
  const N = 60;
  for (let i = 0; i < N; i++) {
    pts.push({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * .4 * dpr, vy: (Math.random() - .5) * .4 * dpr,
      r: Math.random() * 1.8 + .5
    });
  }

  window.addEventListener('touchmove', (e) => {
    if(e.touches.length > 0) {
      touchX = e.touches[0].clientX * dpr;
      touchY = e.touches[0].clientY * dpr;
    }
  }, { passive: true });
  
  window.addEventListener('touchend', () => { touchX = null; touchY = null; });
  
  const tick = () => {
    ctx.clearRect(0, 0, w, h);
    for (const p of pts) {
      if (touchX !== null) {
        const dx = p.x - touchX;
        const dy = p.y - touchY;
        const dist = Math.hypot(dx, dy);
        if (dist < 120 * dpr) {
          const force = (120 * dpr - dist) / (120 * dpr);
          p.vx += (dx / dist) * force * 0.5;
          p.vy += (dy / dist) * force * 0.5;
        }
      }
      
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.98;
      p.vy *= 0.98;
      
      if (Math.abs(p.vx) < 0.1) p.vx += (Math.random() - 0.5) * 0.1;
      if (Math.abs(p.vy) < 0.1) p.vy += (Math.random() - 0.5) * 0.1;

      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
    }
    
    const maxD = 120 * dpr;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i];
      for (let j = i + 1; j < pts.length; j++) {
        const b = pts[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d = Math.hypot(dx, dy);
        if (d < maxD) {
          const alpha = (1 - d / maxD) * .4;
          ctx.strokeStyle = 'rgba(125,211,252,' + alpha + ')';
          ctx.lineWidth = .8 * dpr;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    for (const p of pts) {
      ctx.beginPath(); 
      ctx.fillStyle = 'rgba(125,211,252,.9)';
      ctx.arc(p.x, p.y, p.r * dpr, 0, Math.PI * 2); 
      ctx.fill();
    }
    requestAnimationFrame(tick);
  };
  tick();
})();

let isRunning = false;
let timeoutId = null;
let currentOp = 'auto';
let success = 0, fail = 0, dispatched = 0;
let sessionTotal = 0, sessionDelay = 0, sessionStart = 0;
let etaTimer = null;
let logFilter = 'all';

[['phoneInput','phoneGroup'],['countInput','countGroup'],['delayInput','delayGroup']].forEach(([inp,grp]) => {
  const i = document.getElementById(inp);
  const g = document.getElementById(grp);
  i.addEventListener('focus', () => g.classList.add('focused'));
  i.addEventListener('blur', () => g.classList.remove('focused'));
  i.addEventListener('input', () => i.classList.remove('invalid'));
});

function setOperator(op) {
  currentOp = op;
  document.querySelectorAll('.pill-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.op === op);
  });
  
  // WAVE DELAY LOCK (အနည်းဆုံး ၂ စက္ကန့်)
  const delayInput = document.getElementById('delayInput');
  if (op === 'wave') {
    delayInput.min = "2";
    delayInput.disabled = true; 
    delayInput.style.opacity = "0.7";
    delayInput.value = "2.0";
    
    // Dispatched နဲ့ Exceptions ကို ဖျောက်မယ်
    document.getElementById('statsWrap').style.display = 'none';
    document.getElementById('progressWrap').style.display = 'none';
    
    // Owner Name ကို @Nytheris_q အဖြစ် ပြမယ်
    document.querySelector('.subtitle').textContent = '@Nytheris_q';
    document.querySelector('.subtitle').style.color = 'var(--accent-green)';
    
  } else {
    delayInput.min = "0";
    delayInput.disabled = false;
    delayInput.style.opacity = "1";
    
    document.getElementById('statsWrap').style.display = 'grid';
    document.getElementById('progressWrap').style.display = 'block';
    
    document.querySelector('.subtitle').textContent = 'ကျော်ကြီးက ချစ်တတ်တယ်';
    document.querySelector('.subtitle').style.color = '#cbd5e1';
  }
}

function bump(el) {
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}

function animateNumber(el, from, to) {
  if (from === to) { el.textContent = String(to); return; }
  const dur = 320;
  const start = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = String(Math.round(from + (to - from) * eased));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function logMsg(msg, type, idx) {
  type = type || 'info';
  const box = document.getElementById('logConsole');
  const time = new Date().toLocaleTimeString('en-GB', { hour12: false });

  const div = document.createElement('div');
  div.className = 'log-line ' + type;
  div.dataset.sev = type === 'success' ? 'ok' : type === 'error' ? 'err' : 'sys';

  const idxText = (idx == null) ? '[--]' : '[' + String(idx).padStart(2, '0') + ']';
  div.innerHTML = `<span class="log-idx">${idxText}</span><span class="log-time">${time}</span><span class="log-msg">${msg}</span>`;

  if (logFilter !== 'all' && div.dataset.sev !== logFilter) div.style.display = 'none';

  const atBottom = box.scrollHeight - box.clientHeight <= box.scrollTop + 30;
  box.appendChild(div);
  while (box.childElementCount > 200) box.removeChild(box.firstElementChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function setLogFilter(f) {
  logFilter = f;
  document.querySelectorAll('.log-tab').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  document.querySelectorAll('.log-line').forEach(d => {
    const sev = d.dataset.sev || 'sys';
    d.style.display = (f === 'all' || sev === f) ? '' : 'none';
  });
}

function clearLogs() {
  const box = document.getElementById('logConsole');
  box.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'log-line sys';
  div.dataset.sev = 'sys';
  div.innerHTML = `<span class="log-idx">[--]</span><span class="log-time">${new Date().toLocaleTimeString('en-GB', { hour12: false })}</span><span class="log-msg">[SYSTEM] Log အားလုံး ရှင်းလင်းပြီးပါပြီ။</span>`;
  box.appendChild(div);
}

function updateUI(running) {
  document.getElementById('startBtn').disabled = running;
  document.getElementById('stopBtn').disabled = !running;
  document.getElementById('startBtn').classList.toggle('engine-active', running);
  document.body.classList.toggle('running', running);
  document.getElementById('statusText').textContent = running ? 'ACTIVE' : 'STANDBY';
}

function updateProgress() {
  if (currentOp === 'wave') return; // Wave မှာ Progress မပြဘူး
  
  const pct = sessionTotal > 0 ? Math.min(100, (dispatched / sessionTotal) * 100) : 0;
  document.getElementById('arcFill').style.width = pct + '%';
  document.getElementById('arcPct').textContent = Math.round(pct) + '%';

  const ticks = document.querySelectorAll('#arcTicks .tick');
  const lit = Math.round((pct / 100) * ticks.length);
  ticks.forEach((t, i) => {
    if (i < lit && !t.classList.contains('on')) t.classList.add('on');
    else if (i >= lit && t.classList.contains('on')) t.classList.remove('on');
  });
}

function tickEta() {
  if (currentOp === 'wave') return;
  if (!sessionStart || !sessionTotal) return;
  const elapsed = (Date.now() - sessionStart) / 1000;
  const per = dispatched > 0 ? elapsed / dispatched : sessionDelay;
  const remain = Math.max(0, sessionTotal - dispatched);
  const eta = remain * per;
  document.getElementById('arcEta').textContent =
    remain === 0 ? '0s' :
    eta < 60 ? Math.ceil(eta) + 's' :
    Math.ceil(eta / 60) + 'm ' + (Math.ceil(eta) % 60) + 's';
}

function normalizePhone(raw) { return String(raw).replace(/[^\d+]/g, '').replace(/^\+/, ''); }

function validate() {
  const p = document.getElementById('phoneInput');
  const c = document.getElementById('countInput');
  const d = document.getElementById('delayInput');
  p.classList.remove('invalid'); c.classList.remove('invalid'); d.classList.remove('invalid');

  const phone = normalizePhone(p.value.trim());
  if (!phone) { p.classList.add('invalid'); return { err: 'ဖုန်းနံပါတ် ထည့်သွင်းပေးပါ။' }; }
  if (!/^(\+?95|0)?9\d{7,9}$/.test(phone)) { p.classList.add('invalid'); return { err: 'ဖုန်းနံပါတ် ပုံစံ မမှန်ကန်ပါ။' }; }

  const count = parseInt(c.value, 10);
  if (!Number.isFinite(count) || count < 1 || count > 1000) { c.classList.add('invalid'); return { err: 'Iterations ကို 1 မှ 1000 အတွင်း ထည့်ပါ။' }; }
  
  let delay = parseFloat(d.value);
  
  // WAVE DELAY LOCK (အနည်းဆုံး ၂ စက္ကန့်)
  if (currentOp === 'wave' && delay < 2) {
    d.classList.add('invalid');
    return { err: 'Wave အတွက် Interval ကို အနည်းဆုံး ၂ စက္ကန့် ထားရပါမည်။' };
  }

  if (!Number.isFinite(delay) || delay < 0) { d.classList.add('invalid'); return { err: 'Interval ကို 0 သို့မဟုတ် အထက် ထည့်ပါ။' }; }

  return { phone, count, delay, op: currentOp };
}

function startAutomation(event) {
  if (event) event.preventDefault();
  if (isRunning) return;
  
  const v = validate();
  if (v.err) { logMsg(v.err, 'error'); return; }

  success = 0; fail = 0; dispatched = 0;
  sessionTotal = v.count; sessionDelay = v.delay; sessionStart = Date.now();

  document.getElementById('successCount').textContent = '0';
  document.getElementById('failCount').textContent = '0';
  updateProgress();

  if (etaTimer) clearInterval(etaTimer);
  etaTimer = setInterval(tickEta, 500);

  isRunning = true;
  updateUI(true);

  logMsg(`Sequence စတင်နေပါပြီ [${v.op.toUpperCase()}] → ${v.phone}`, 'sys');

  let currentIdx = 1;

  async function fireRequest() {
    if (!isRunning || currentIdx > v.count) return;
    
    const i = currentIdx;
    
    let resObj = { success: false };
    
    try {
      const controller = new AbortController();
      const reqTimeout = setTimeout(() => controller.abort(), 5000);

      const res = await fetch(`${BACKEND_URL}/api/bomb?phone=${encodeURIComponent(v.phone)}`, {
        signal: controller.signal
      });
      clearTimeout(reqTimeout);
      
      const data = await res.json();
      
      if (data.status === 'success') {
        resObj.success = true;
      } else {
        resObj.success = false;
      }
    } catch (e) {
      resObj.success = false;
    }
    
    if (!isRunning) return;
    
    if (resObj.success) {
      success++; dispatched++;
      if(currentOp !== 'wave'){
        const el = document.getElementById('successCount');
        animateNumber(el, success - 1, success);
        bump(el);
      }
      logMsg(`Node #${i} | အောင်မြင်ပါသည် ✅`, 'success', i);
    } else {
      dispatched++;
      fail++;
      if(currentOp !== 'wave'){
        const el = document.getElementById('failCount');
        el.textContent = String(fail);
      }
    }
    
    updateProgress(); tickEta();
    
    currentIdx++;
    if (currentIdx <= v.count) {
      timeoutId = setTimeout(fireRequest, Math.max(0, v.delay * 1000));
    } else {
      isRunning = false;
      updateUI(false);
      updateProgress();
      logMsg(`ပို့ဆောင်မှု ပြီးစီးပါပြီ။ စုစုပေါင်း ${success} ခု အောင်မြင်ပါသည်။`, 'sys');
    }
  }
  
  fireRequest();
}

function stopAutomation(event) {
  if (event) event.preventDefault();
  if (!isRunning) return;
  
  isRunning = false;
  if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
  if (etaTimer) { clearInterval(etaTimer); etaTimer = null; }
  updateUI(false);
  updateProgress();
  
  if (dispatched > 0) logMsg('Sequence ကို ရပ်တန့်လိုက်ပါပြီ။', 'sys');
  else logMsg('မစတင်မီ ရပ်တန့်လိုက်ပါပြီ။', 'sys');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !document.getElementById('startBtn').disabled) {
    e.preventDefault(); startAutomation();
  } else if (e.key === 'Escape' && !document.getElementById('stopBtn').disabled) {
    e.preventDefault(); stopAutomation();
  }
});

setOperator('auto');
updateProgress();
</script>
